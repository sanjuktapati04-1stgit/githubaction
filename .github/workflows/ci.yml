name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run:
          test -f test.html
          grep -q "<h1>" test.html
      - name: Build
        run: mkdir -p build && cp test.html build/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/