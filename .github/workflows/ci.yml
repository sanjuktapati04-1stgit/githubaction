name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate HTML file
        run: |
          test -f test.html
          grep -q "<h1" test.html
          grep -q "<title>" test.html
          grep -q '<dialog' test.html
          grep -q 'id="theme-toggle"' test.html
          grep -q 'id="contact-form"' test.html

      - name: Prepare build output
        run: |
          mkdir -p build
          cp test.html build/index.html

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/
          if-no-files-found: error